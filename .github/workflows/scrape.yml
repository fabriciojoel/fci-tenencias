name: scrape-carteras-fci

# Tiempo esperado: desde EE.UU. la CNV tarda ~22 s por pagina y worker.
# 1.706 fondos / 4 shards / 3 workers ~ 70-80 min por shard (en paralelo) + merge de segundos.
# Desde una PC argentina la corrida completa tarda ~52 min con 2 workers (medido 17/10/2026).

on:
  schedule:
    - cron: "0 10 2,17 * *"   # dias 2 y 17, 07:00 Argentina
  workflow_dispatch:
    inputs:
      limit:
        description: "Prueba: fondos por shard (0 = corrida completa)"
        default: "0"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape shard
        run: |
          L="${{ github.event.inputs.limit }}"
          if [ -n "$L" ] && [ "$L" != "0" ]; then ARGS="--limit $L"; else ARGS=""; fi
          python scrape.py --shard ${{ matrix.shard }}/4 --workers 3 $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: data/parts/shard-${{ matrix.shard }}.json
          retention-days: 3

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge
        run: |
          python scrape.py --merge parts
          python build_site_data.py data/carteras/$(date -u +%F).json
      - name: Commit data
        if: ${{ github.event.inputs.limit == '' || github.event.inputs.limit == '0' }}
        run: |
          git config user.name "fci-tenencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tenencias_on.json data/carteras data/fondos.json data/fondo
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "datos $(date -u +%F)" && git push; fi
